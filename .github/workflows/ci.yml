name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches a bundled price snapshot that has drifted from the live
    # catalogue, before a release ships a wrong Toman number.
    - cron: "17 6 * * 1"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Offline tests
        working-directory: python
        run: pytest tests/test_pricing.py -q
      - name: Live tests (public endpoints, no API key)
        working-directory: python
        run: pytest -m live -q
        continue-on-error: true
      - name: Examples compile
        run: python -m compileall -q examples/python scripts

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        working-directory: node
        run: npm install
      - name: Typecheck
        working-directory: node
        run: npm run typecheck
      - name: Build + test
        working-directory: node
        run: npm test
      - name: Examples parse
        run: for f in examples/node/*.mjs; do node --check "$f"; done
